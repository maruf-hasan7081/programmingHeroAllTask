<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <h1>dom event </h1>

    <button onclick="console.log('first button')">first button</button>
    <button onclick="console.log(7)">2nd button</button>
    <button onclick="console.log('Login successful')">login</button>


    <button onclick="colorchange(count)">change color</button>


    <script>
        let count = 1;

      function colorchange(){
        if(count==1){
          document.body.style.backgroundColor="green";
          count=2;

        } else if(count==2){
          document.body.style.backgroundColor="red";
          count=1;
        }
        
      }

    </script>



    <script src="./js/event1.js"></script>
    
</body>
</html>
